# DMBA health plans for 2027
# yaml-language-server: $schema=../../../schema/plan-year.schema.json
#
# Sources: DMBA 2027 Plan Comparison Information (sources/2027-summary.md) for benefits, and
# DMBA's 2027 open enrollment slides (sources/2027-open-enrollment.md) for premiums and
# employer HSA contributions. Three plans: PPO 80 (new), HSA 80, and HSA 60. PPO 70 and
# PPO 90 are gone.
#
# Visit and cost caps, preventive care at no charge, and HSA telemedicine before the
# deductible are in neither source; they carry over from 2026 (2025 SBCs).

year: 2027

