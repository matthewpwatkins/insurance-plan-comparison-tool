  # PPO 80 Plan - New for 2027. Copays like the old PPOs, but with a deductible.
  # Copays (office visits, urgent care, ER, therapy, chiropractic) apply only after the
  # deductible is met; until then the member pays the full allowed amount (open enrollment
  # slides). Mental health, eye exam, and out-of-network wellness copays are assumed to work
  # the same way. Copays count toward the out-of-pocket max.
  # Tier 1 drugs skip the deductible but still count toward it and the out-of-pocket max.
  # Tier 2, tier 3, and specialty drugs wait for the deductible; the slides send those
  # questions to Navitus.
  - name: "DMBA PPO 80"
    short_name: "PPO 80"
