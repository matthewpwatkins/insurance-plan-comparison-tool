# yaml-language-server: $schema=../../schema/company.schema.json

# Copy this folder to data/companies/<your-company-slug>/ (lowercase letters, digits, dashes).
# The folder name becomes the URL: https://health-plans.netlify.app/<your-company-slug>

# Shown in the page header and browser tab title
name: Example Co
# Optional. Who pays claims, if different from the company (used in the EOB help text).
# insurer_name: Example Insurance

# Optional. Replaces the default welcome blurb.
# welcome: Welcome to Example Co open enrollment!

# Optional. How your FSA is named in help text.
# fsa_name: "Example Co's FSA"

# Optional. Where members find past claims. Steps are shown as a numbered list.
# claims_portal:
#   name: Example Claims Portal
#   url: https://example.com/claims
#   steps:
#     - Open Claims > History
#     - Download a detailed report for the past 2 years

# Optional. The AI chat tool employees should use to turn their claims report into estimates.
# The guided setup links to it and hands the user a prompt to paste in.
# ai_assistant:
#   name: Example AI Chat
#   url: https://example.com/chat
#   note: Start a temporary chat so the conversation isn't saved.

# Optional. Lets people load the claims report above and get estimates from it, if a
# reader exists for its layout (see "Reading claims reports" in CONTRIBUTING.md).
# claims_report:
#   format: dmba-eob
#   service_map:
#     OFFICE VISIT: [office_visit_pcp, office_visit_specialist]
#     LAB / PATHOLOGY: [laboratory_outpatient]
#   add_to_main_service: [MEDICAL SUPPLIES]

# Optional. A third-party price lookup tool for future procedures.
# cost_estimator:
#   provider: Example Hospital
#   name: example.com/pricing
#   url: https://example.com/pricing
