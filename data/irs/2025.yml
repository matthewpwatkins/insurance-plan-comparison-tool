# Federal limits for 2025 (set annually by IRS and SSA). Shared by every company.

# HSA Contribution Limits (set by IRS annually)
hsa_contribution_limits:
  single_coverage: 4_300
  family_coverage: 8_550
  catch_up_age_55_plus: 1_000

# HSA Qualification Requirements (set by IRS annually)
# A plan must meet these minimum deductibles to qualify for an HSA
hsa_qualification_limits:
  minimum_deductible:
    single: 1_650
    family: 3_300
  maximum_out_of_pocket:
    single: 8_300
    family: 16_600

# FSA Contribution Limits (set by IRS annually)
fsa_contribution_limits:
  healthcare_fsa: 3_300
  # Most unused money that rolls into the next plan year (Rev. Proc. 2024-40). Employers may
  # allow less; DMBA allows the full amount.
  carryover: 660

# Payroll Tax Rates (set by IRS/SSA annually)
payroll_tax_rates:
  social_security: 6.2
  medicare: 1.45


# Expected rise in healthcare prices going into this year, in percent. Default for growing
# last year's claims into this year's estimates. BLS CPI-U medical care services, 12 months to
# December 2024: https://data.bls.gov/timeseries/CUUR0000SAM2
healthcare_price_increase: 3.4
