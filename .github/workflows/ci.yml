name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build-data
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watchAll=false
        env:
          CI: true
